name: Publish pgfire to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    # auto-release.yml dispatches this explicitly - a release created with
    # the default GITHUB_TOKEN doesn't trigger the `release: published`
    # listener above (GitHub's anti-recursion rule), so auto-release.yml
    # can't just rely on this trigger firing on its own.

jobs:
  pypi-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build source and wheel distributions
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
