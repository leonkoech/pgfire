[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgfire"
version = "0.0.1"  # Matches the tag version you just created
description = "A lightweight Firestore-to-PostgreSQL JSONB developer experience migration bridge."
readme = "README.md"
authors = [{ name = "Leon Koech" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "psycopg[binary]>=3.1.0"
]
requires-python = ">=3.10"
