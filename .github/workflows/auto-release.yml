name: Auto-release on version bump

# Automates what had to be done by hand for 0.1.1: the only manual step
# from here on is bumping `version` in pyproject.toml and merging to main.
# This workflow tags that commit, creates a GitHub Release, and then
# explicitly dispatches publish.yml itself.
#
# That last step matters: a release created with the default
# GITHUB_TOKEN inside a workflow does NOT trigger other workflows'
# event listeners (e.g. publish.yml's `on: release: published`) - a
# deliberate GitHub Actions anti-recursion rule. v0.1.2 silently never
# published because of exactly this (confirmed: no publish.yml run
# appeared for its release event at all). An explicit
# `gh workflow run` dispatch isn't subject to that restriction, so
# this workflow triggers publish.yml itself rather than relying on it
# to notice the release.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag + GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Dispatch PyPI publish directly (release event won't fire it)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml --ref main
