[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgfire"
version = "0.1.1"
description = "A lightweight Firestore-to-PostgreSQL JSONB developer experience migration bridge."
readme = "README.md"
authors = [{ name = "Leon Koech" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "psycopg2-binary>=2.9.0"
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
include = ["pgfire*"]
